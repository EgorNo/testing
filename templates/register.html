<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; background: #f0f2f5;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px;
    }
    h2 { text-align: center; margin-bottom: 20px; color: #333; }
    input {
      width: 100%; padding: 10px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
    }
    button {
      width: 100%; padding: 10px; background: #28a745; color: white;
      border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
    }
    button:hover { background: #1e7e34; }
    .message { text-align: center; padding: 8px; margin-bottom: 15px;
               border-radius: 5px; font-size: 14px; }
    .message.error { background: #ffe0e0; color: #b30000; }
    .link { text-align: center; margin-top: 15px; font-size: 14px; }
    .link a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Регистрация</h2>
    {% if error %}<p class="message error">{{ error }}</p>{% endif %}
    <form action="/register" method="POST">
      <input type="text"     name="username" placeholder="Придумайте логин" required>
      <input type="password" name="password" placeholder="Пароль"           required>
      <input type="password" name="confirm"  placeholder="Повторите пароль" required>
      <button type="submit">Создать аккаунт</button>
    </form>
    <p class="link">Уже есть аккаунт? <a href="/">Войти</a></p>
  </div>
</body>
</html>
